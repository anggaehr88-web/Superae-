
name: Build SUPERA.E APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      # 1. Ambil source repository
      - name: Checkout source
        uses: actions/checkout@v5

      # 2. Siapkan Java
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 3. Cari Android SDK dan sdkmanager
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found in $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 6 -type f -name sdkmanager || true
            exit 1
          fi

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Found SDK: $SDK_ROOT"
          echo "Found sdkmanager: $SDKMANAGER"

          echo "SDKMANAGER_PATH=$SDKMANAGER" >> "$GITHUB_ENV"

      # 4. Pasang SDK, NDK, dan CMake
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$SDKMANAGER_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          CMAKE_DIR="$SDK_ROOT/cmake/3.22.1"

          if [ ! -d "$NDK_DIR" ]; then
            echo "ERROR: Android NDK installation failed"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

          if [ -d "$CMAKE_DIR/bin" ]; then
            echo "$CMAKE_DIR/bin" >> "$GITHUB_PATH"
          fi

          echo "Android SDK, NDK and CMake are ready."

      # 5. Periksa dan ekstrak source ZIP
      - name: Extract SUPERA.E project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SUPERA.E project ZIP not found."
            exit 1
          fi

          PROJECT_ROOT="$RUNNER_TEMP/superae-project"

          mkdir -p "$PROJECT_ROOT"
          unzip -q "$ZIP_FILE" -d "$PROJECT_ROOT"

          PROJECT_DIR="$PROJECT_ROOT/SUPERA_E_Native_Android"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Android project structure not found."
            find "$PROJECT_ROOT" -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "SUPERA_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project extracted successfully."

      # 6. Unduh dan siapkan llama.kt
      - name: Prepare native AI engine
        shell: bash
        run: |
          set -euo pipefail

          cd "$SUPERA_PROJECT"

          chmod +x scripts/setup-native-engine.sh

          bash scripts/setup-native-engine.sh

          if [ ! -d "third_party/llama.kt/llama-kt" ]; then
            echo "ERROR: llama.kt Android module not found."
            exit 1
          fi

          echo "Native AI engine prepared."

      # 7. Periksa lingkungan build
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Android NDK:"
          echo "$ANDROID_NDK_HOME"

          echo "Project:"
          echo "$SUPERA_PROJECT"

          test -f "$SUPERA_PROJECT/app/build.gradle.kts"
          test -f "$SUPERA_PROJECT/scripts/build-apk.sh"

      # 8. Kompilasi APK
      - name: Build SUPERA.E APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SUPERA_PROJECT"

          chmod +x scripts/build-apk.sh

          bash scripts/build-apk.sh

          APK="$SUPERA_PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK output not found."
            exit 1
          fi

          ls -lh "$APK"

      # 9. Upload APK ke GitHub
      - name: Upload SUPERA.E APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SUPERA-E-debug-APK
          path: ${{ runner.temp }}/superae-project/SUPERA_E_Native_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

          
      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            glslc \
            spirv-headers

          echo "Checking glslc..."
          command -v glslc
          glslc --version

